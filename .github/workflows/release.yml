name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Import codesigning certificate
        # 固定自签证书签名：TCC 授权锚点是证书根哈希而非二进制哈希，
        # 替换安装后权限不重弹。无 secret 时 build.sh 自动降级 ad-hoc。
        env:
          P12_BASE64: ${{ secrets.KAKU_CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.KAKU_CODESIGN_P12_PASSWORD }}
          CRT_PEM: ${{ secrets.KAKU_CODESIGN_CRT_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ]; then
            echo "[codesign] KAKU_CODESIGN_P12_BASE64 not set → build.sh will fall back to ad-hoc"
            exit 0
          fi
          KEYCHAIN="build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # 私钥走 P12（security 原生解析，不碰 openssl）；信任走 CRT_PEM。
          printf '%s' "$P12_BASE64" | base64 -d > /tmp/codesign.p12
          printf '%s\n' "$CRT_PEM" > /tmp/codesign.crt
          security import /tmp/codesign.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          # add-trusted-cert 写用户钥匙串会等 Security Agent UI（headless 永远等不到）：
          # sudo 写 System keychain 是无 UI 路径；perl alarm 兜底防静默挂死。
          sudo perl -e 'alarm 60; exec @ARGV' -- \
            security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/codesign.crt
          perl -e 'alarm 60; exec @ARGV' -- \
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security find-identity -v -p codesigning

      - name: Build app bundle + DMG
        run: set -o pipefail; bash scripts/build.sh 2>&1 | sed '/has no symbols/d'

      - name: Verify bundled shell plugins are pinned
        run: |
          test -d dist/Kaku.app
          test "$(cat dist/Kaku.app/Contents/Resources/vendor/zsh-autosuggestions/.kaku-vendor-ref)" = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5"
          test "$(cat dist/Kaku.app/Contents/Resources/vendor/fast-syntax-highlighting/.kaku-vendor-ref)" = "3d574ccf48804b10dca52625df13da5edae7f553"
          test "$(cat dist/Kaku.app/Contents/Resources/vendor/zsh-completions/.kaku-vendor-ref)" = "84615f3d0b0e943d5b1de862c9552e572c8e70bb"

      - name: Upload DMG artifact (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Kaku-macOS
          path: dist/Kaku.dmg
          if-no-files-found: error
          retention-days: 3

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/Kaku.dmg
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Prune old releases (keep latest only)
        # Free-tier storage hygiene: drop old DMG releases after each publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isLatest --jq '.[] | select(.isLatest == false) | .tagName')
          for tag in $tags; do
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag \
              || gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes || true
          done

      - name: Cleanup signing keychain
        if: always()
        run: |
          security default-keychain -s ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          security delete-keychain build.keychain-db 2>/dev/null || true
          rm -f /tmp/codesign.p12 /tmp/codesign.crt
